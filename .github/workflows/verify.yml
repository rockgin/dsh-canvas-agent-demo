name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The demo is a plugin, so it is verified inside a real Harness checkout at a
  # pinned revision. Bump this together with the @deepseek-ai/* versions in the
  # plugin's package.json.
  DSH_REF: 39163dd30f703a79079e2d2446545cff3c453738
  DSH_TELEMETRY_DISABLED: '1'
  PLUGIN_ID: '@dsh-demo/dsh-client-ui-canvas-agent'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DSH_ROOT: ${{ github.workspace }}/dsh

    steps:
      - name: Check out the demo
        uses: actions/checkout@v4
        with:
          path: demo

      - name: Check out DeepSeek Harness at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: dsh
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dsh/pnpm-lock.yaml

      - name: Install the demo plugin into the checkout
        working-directory: demo
        run: node scripts/install-into-dsh.mjs "$DSH_ROOT"

      # dsh build scripts rely on `import.meta.main` (Node 24.9+) and silently
      # no-op on older 24.x, so fail loudly instead of reporting a fake pass.
      - name: Check the toolchain
        working-directory: dsh
        run: |
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number)
            if (major < 24 || (major === 24 && minor < 9)) {
              console.error(`Node ${process.versions.node} is too old; dsh needs >= 24.9`)
              process.exit(1)
            }
          '

      # The plugin adds a workspace package, so the pinned lockfile no longer
      # matches. This is the one place where a non-frozen install is correct.
      - name: Install workspace dependencies
        working-directory: dsh
        run: pnpm install --no-frozen-lockfile

      - name: Type-check the whole client face
        working-directory: dsh
        run: pnpm typecheck

      - name: Build host, client, and web artifacts
        working-directory: dsh
        run: pnpm build:artifacts

      - name: Assert the plugin bundle was emitted
        working-directory: dsh
        run: |
          set -euo pipefail
          lib=packages/client/ui-canvas-agent-demo/lib
          test -f "$lib/index.js"
          test -f "$lib/client.js"
          grep -q 'canvas-agent-floating' "$lib/client.js"
          echo "plugin bundle present: $(wc -c < "$lib/client.js") bytes"

      # Boots the real web profile and proves the browser roster serves the
      # plugin module. No browser is needed: the assertions are HTTP-level.
      #
      # The startup line carries a one-shot process token. Requesting it sets a
      # signed session cookie and redirects to the plain origin, so keep a
      # cookie jar and reuse it for the plugin asset; a bare "/" returns 401.
      - name: Boot the web app and fetch the plugin asset
        working-directory: dsh
        run: |
          set -euo pipefail
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          pnpm dsh web --patch ./canvas-agent.overlay.yml --no-open --port 0 > web.log 2>&1 &
          pid=$!

          launch=''
          for _ in $(seq 1 150); do
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' web.log > web.clean.log
            launch=$(grep -oE 'http://127\.0\.0\.1:[0-9]+[^[:space:]]*' web.clean.log | head -n1 || true)
            if [ -n "$launch" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'web process exited before printing a URL'
              cat web.clean.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$launch" ]; then
            echo 'timed out waiting for the web URL'
            cat web.clean.log
            exit 1
          fi
          origin=$(printf '%s' "$launch" | sed -E 's#^(https?://[^/]+).*#\1#')
          echo "serving at $origin"

          jar=web-cookies.txt
          curl -fsSL -c "$jar" -b "$jar" "$launch" -o index.html
          grep -q 'id="root"' index.html

          curl -fsS -c "$jar" -b "$jar" "$origin/plugins/$PLUGIN_ID/client.js" -o plugin.js
          grep -q 'canvas-agent-floating' plugin.js
          echo 'web smoke passed'

      - name: Upload web log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-log
          path: |
            dsh/web.log
            dsh/web.clean.log
            dsh/web-cookies.txt
          if-no-files-found: ignore
